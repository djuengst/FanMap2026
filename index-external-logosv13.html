  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f3f6f9;
      color: #0f172a;
      scroll-behavior: smooth;
    }

    /* Map container styling matching Surf Cup Sports Park base graphic */
    .surf-map-bg {
      background-color: #9ec3d6;
      border: 2px solid #5a8aa3;
    }

    .parking-bar {
      background-color: #216083;
    }

    .hq-bar {
      background-color: #216083;
    }

    .field-card {
      background-color: #ffffff;
      border: 2px solid #216083;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      aspect-ratio: 1 / 2.25;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .field-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 6px rgba(0,0,0,0.14);
    }
    .field-card:active {
      transform: scale(0.98);
    }

    .field-slot-top {
      height: 29%;
      border-bottom: 1.5px solid #216083;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 1px;
    }

    .field-slot-mid {
      height: 42%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background-color: #ffffff;
    }

    .field-slot-bot {
      height: 29%;
      border-top: 1.5px solid #216083;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 1px;
    }

    /* Distinct blue border for Field Pass fields (3, 4, 12, 13) */
    .field-card.field-pass-border {
      border: 2.5px solid #0a14e6;
    }
    .field-card.field-pass-border .field-slot-top {
      border-bottom: 1.5px solid #0a14e6;
    }
    .field-card.field-pass-border .field-slot-bot {
      border-top: 1.5px solid #0a14e6;
    }
    .field-card.field-pass-border .field-num-circle {
      border-color: #0a14e6;
      color: #0a14e6;
    }

    /* Distinct red border for Showcase field (5) */
    .field-card.showcase-border {
      border: 2.5px solid #dc2626;
    }
    .field-card.showcase-border .field-slot-top {
      border-bottom: 1.5px solid #dc2626;
    }
    .field-card.showcase-border .field-slot-bot {
      border-top: 1.5px solid #dc2626;
    }
    .field-card.showcase-border .field-num-circle {
      border-color: #dc2626;
      color: #dc2626;
    }

    .field-num-circle {
      width: 36px;
      height: 36px;
      border-radius: 9999px;
      border: 2.5px solid #216083;
      color: #216083;
      font-weight: 900;
      font-size: 1.05rem;
      letter-spacing: -0.03em;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      background: #ffffff;
      z-index: 2;
    }

    @media (max-width: 640px) {
      .field-num-circle {
        width: 25px;
        height: 25px;
        font-size: 0.78rem;
        border-width: 2px;
      }
    }

    /* Vertical El Camino Real text */
    .vertical-road {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      letter-spacing: 0.14em;
      color: #b85d57;
      font-weight: 800;
    }

    .vertical-side-label {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      color: #b85d57;
      font-weight: 800;
      font-size: 0.55rem;
      letter-spacing: 0.08em;
    }

    /* Print / Save One-Page Styles */
    @media print {
      @page {
        size: letter portrait;
        margin: 0.25in;
      }
      body {
        background: #ffffff !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .no-print {
        display: none !important;
      }
      .print-container {
        display: grid !important;
        grid-template-columns: 62% 36% !important;
        gap: 2% !important;
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .round-map-wrapper {
        margin-bottom: 8px !important;
        page-break-inside: avoid;
      }
    }
  </style>

<body id="top" class="min-h-screen pb-16">

  <!-- TOP HEADER BANNER (Not sticky on mobile so it doesn't eat screen space; sticky on desktop) -->
  <header class="bg-white border-b-2 border-slate-800 md:sticky md:top-0 z-40 shadow-sm">

      <div class="flex items-center gap-2 no-print">

        <button onclick="window.print()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold shadow transition" title="Print or Save as Single-Page PDF">

    <!-- TEAM SELECTOR CONTROLS BAR (Scrolls away on mobile, sticky on desktop) -->
    <div class="bg-slate-100 border-t border-slate-200 px-3 sm:px-6 py-2 no-print">
      <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2">
        
        <!-- Left: Search + Division Dropdown + Add Team -->
        <div class="flex flex-wrap items-center gap-2 flex-1 min-w-[260px]">
          <!-- Division Filter -->
          <select id="divisionFilter" onchange="populateDropdown()" class="text-xs font-bold bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-600">

          <!-- Searchable Input + Dropdown -->
          <div class="relative flex-1 max-w-xs">
            <input

            />
            <svg class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <!-- Search Dropdown Menu -->

          </div>

          <!-- Quick Select Dropdown -->
          <select id="quickTeamSelect" onchange="handleDropdownSelect(this)" class="text-xs font-semibold bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-600">
            <option value="">+ Quick Add Team...</option>
          </select>

          <!-- Preset / Reset Buttons -->
          <button onclick="loadMockupPreset()" class="text-xs font-bold px-2.5 py-1.5 rounded-lg bg-blue-100 text-blue-900 hover:bg-blue-200 transition" title="Load the 12 teams from FanMap-static.png">
            Load FanMap Preset (12)
          </button>
          <button onclick="clearAllTeams()" class="text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-slate-200 text-slate-700 hover:bg-red-100 hover:text-red-700 transition">
            Clear All
          </button>
        </div>

        <!-- Right: Desktop Quick-Jump Round Buttons -->
        <div class="hidden md:flex items-center gap-1 text-xs font-extrabold">
          <span class="text-slate-500 mr-1">Jump:</span>
          <a href="#round-1" class="px-2 py-1 rounded bg-white border border-slate-300 text-slate-800 hover:bg-blue-50">R1 <span class="font-normal text-[10px]">9:00</span></a>
          <a href="#round-2" class="px-2 py-1 rounded bg-white border border-slate-300 text-slate-800 hover:bg-blue-50">R2 <span class="font-normal text-[10px]">11:15</span></a>
          <a href="#round-3" class="px-2 py-1 rounded bg-white border border-slate-300 text-slate-800 hover:bg-blue-50">R3 <span class="font-normal text-[10px]">1:30</span></a>
          <a href="#round-4" class="px-2 py-1 rounded bg-white border border-slate-300 text-slate-800 hover:bg-blue-50">R4 <span class="font-normal text-[10px]">3:45</span></a>

      </div>

  </header>

  <!-- COMPACT FLOATING MOBILE QUICK-JUMP BAR (Bottom Right on Mobile Only) -->
  <div class="md:hidden fixed bottom-3 right-3 z-40 no-print flex items-center gap-1 bg-slate-900/90 backdrop-blur text-white px-2.5 py-1.5 rounded-full shadow-lg border border-slate-700 text-[11px] font-extrabold">

  <!-- MAIN CONTENT AREA -->
  <main class="max-w-7xl mx-auto px-2 sm:px-6 pt-4">

    <div class="flex items-center justify-between mb-3 px-2">

  <script>
    // ============================================================================
    // 1. OFFICIAL 48 TEAM LOGOS (RELATIVE GITHUB PATHS + EMBEDDED DATA FALLBACK)
    // ============================================================================

    // ============================================================================
    function getTeamBadgeHTML(teamId, sizeClass = "w-7 h-7") {
      const team = TEAMS[teamId];
      if (!team) return '';

      const b64Src = TEAM_LOGOS_DATA[teamId];
      const fileSrc = TEAM_LOGO_FILES[teamId];

      // Primary source uses embedded WebP (instant render everywhere) or ./logos/ file on GitHub
      const primarySrc = b64Src || fileSrc || '';

      return `
        <div class="${sizeClass} flex items-center justify-center select-none overflow-hidden" title="${team.fullName}">
          <img
            src="${primarySrc}"
            data-file-src="${fileSrc || ''}"
            alt="${team.name}"
            class="w-full h-full object-contain"
            onerror="if(this.dataset.fileSrc && this.src !== this.dataset.fileSrc){this.src = this.dataset.fileSrc;}"
          />
        </div>
      `;

    // ============================================================================
    // 6. RENDER FIELD BOX CONTENT (FOLLOWING EXACT MOCKUP RULES)
    // ============================================================================
    function getFieldContent(roundObj, fieldNum) {
      const match = roundObj.games.find(g => g.field === fieldNum);
      if (!match) return { topHTML: '', botHTML: '', isActive: false };

      const t1Selected = selectedTeamIds.includes(match.t1);
      const t2Selected = selectedTeamIds.includes(match.t2);

      if (!t1Selected && !t2Selected) {
        return { topHTML: '', botHTML: '', isActive: false };
      }

      const team1 = TEAMS[match.t1];
      const team2 = TEAMS[match.t2];

      if (t1Selected && t2Selected) {
        // Head-to-head between two selected teams: Both official logos shown!
        return {
          topHTML: getTeamBadgeHTML(match.t1, "w-7 h-7 sm:w-9 sm:h-9"),
          botHTML: getTeamBadgeHTML(match.t2, "w-7 h-7 sm:w-9 sm:h-9"),
          isActive: true,
          tooltip: `Field ${fieldNum}: ${team1.name} vs. ${team2.name}`
        };
      }

      if (t1Selected) {
        return {
          topHTML: getTeamBadgeHTML(match.t1, "w-7 h-7 sm:w-9 sm:h-9"),
          botHTML: `<span class="text-[9px] sm:text-[11px] font-bold text-slate-900 leading-none tracking-tight truncate px-0.5">${team2.shortLabel}</span>`,
          isActive: true,
          tooltip: `Field ${fieldNum}: ${team1.name} vs. ${team2.name}`
        };
      }

      // t2Selected only -> Selected team (t2) logo in top box, opponent (t1) short name in bottom box

        topHTML: getTeamBadgeHTML(match.t2, "w-7 h-7 sm:w-9 sm:h-9"),
        botHTML: `<span class="text-[9px] sm:text-[11px] font-bold text-slate-900 leading-none tracking-tight truncate px-0.5">${team1.shortLabel}</span>`,
        isActive: true,
        tooltip: `Field ${fieldNum}: ${team2.name} vs. ${team1.name}`
      };
    }

      const { topHTML, botHTML, isActive, tooltip } = getFieldContent(roundObj, fieldNum);
      const activeRing = isActive ? 'ring-1 ring-slate-900/20' : '';
      let specialBorderClass = '';
      if ([3, 4, 12, 13].includes(fieldNum)) {
        specialBorderClass = 'field-pass-border';
      } else if (fieldNum === 5) {
        specialBorderClass = 'showcase-border';
      }

      const match = roundObj.games.find(g => g.field === fieldNum);
      const fullTooltip = match
        ? `Field ${fieldNum}: ${TEAMS[match.t1].name} vs. ${TEAMS[match.t2].name} (Click/tap for details)`
        : (tooltip || `Field ${fieldNum}`);

      return `
        <div onclick="openGamePopup(${roundObj.roundNum}, ${fieldNum})" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openGamePopup(${roundObj.roundNum}, ${fieldNum});}" class="field-card ${specialBorderClass} ${activeRing}" title="${fullTooltip}">
          <div class="field-slot-top">${topHTML}</div>
          <div class="field-slot-mid">
            <div class="field-num-circle">${fieldNum}</div>
          </div>
          <div class="field-slot-bot">${botHTML}</div>
        </div>
      `;
    }

                <div class="w-12 h-12 sm:w-14 sm:h-14 shrink-0 flex items-center justify-center select-none">
                  <img
                    src="logos/Club_Championships_2026_F_Circle_Color.png"
                    alt="2026 USA Ultimate Club National Championships"
                    class="w-full h-full object-contain drop-shadow-sm"
                  />
                </div>

                <!-- Round Title & Parking Strip -->
                <div class="flex-1">
                  <div class="text-center font-black text-sm sm:text-lg tracking-wide text-slate-950 mb-1">
                    ${roundObj.label}
                  </div>
                  <div class="parking-bar text-white text-center font-extrabold text-[10px] sm:text-xs tracking-widest py-0.5 rounded-xs">
                    PARKING
                  </div>
                </div>
              </div>

              <!-- TOP ROW OF FIELDS (1 - 9) + HQ COLUMN -->
              <div class="relative flex items-center">
                <!-- EXIT Vertical Label -->
                <span class="vertical-side-label mr-0.5">EXIT</span>

                <div class="grid grid-cols-10 gap-1 sm:gap-1.5 flex-1 items-stretch">
                  <!-- Fields 1, 2, 3, 4, 5 -->
                  <div>${renderSingleFieldHTML(roundObj, 1)}</div>
                  <div>${renderSingleFieldHTML(roundObj, 2)}</div>
                  <div>${renderSingleFieldHTML(roundObj, 3)}</div>
                  <div>${renderSingleFieldHTML(roundObj, 4)}</div>
                  <div>${renderSingleFieldHTML(roundObj, 5)}</div>

                  <!-- HQ / Food / Merch Pillar -->
                  <div class="hq-bar text-white flex flex-col items-center justify-around py-1.5 px-1 rounded-xs select-none">
                    <!-- Fork & Knife Icon -->
                    <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M15 3l6 6-9 9-6-6 9-9z"/>
                    </svg>
                    <!-- Jersey Icon -->
                    <svg class="w-4 h-4 sm:w-5 sm:h-5 text-white" viewBox="0 0 24 24" fill="currentColor">
                      <path d="M16 4l4 3-2 4-2-1v10H8V10l-2 1-2-4 4-3h2a2 2 0 004 0h2z"/>
                    </svg>
                    <span class="font-black text-[9px] sm:text-[11px] tracking-tight">HQ</span>
                  </div>

                  <!-- Fields 6, 7, 8, 9 -->
                  <div>${renderSingleFieldHTML(roundObj, 6)}</div>
                  <div>${renderSingleFieldHTML(roundObj, 7)}</div>
                  <div>${renderSingleFieldHTML(roundObj, 8)}</div>
                  <div>${renderSingleFieldHTML(roundObj, 9)}</div>
                </div>

                <!-- ENTRANCE Vertical Label -->
                <span class="vertical-side-label ml-0.5">ENTRANCE</span>
              </div>

              <!-- CENTRAL WALKWAY WITH MEDICAL CROSSES -->
              <div class="flex items-center justify-between px-16 sm:px-28 py-1 select-none">
                <span class="text-red-600 font-black text-sm sm:text-base leading-none">+</span>
                <span class="text-red-600 font-black text-sm sm:text-base leading-none">+</span>
              </div>

              <!-- BOTTOM ROW OF FIELDS (10 - 18) + BYE ROUND BOX -->
              <div class="grid grid-cols-11 gap-1 sm:gap-1.5 items-stretch pl-3 pr-3">
                <!-- Fields 10, 11, 12, 13 -->
                <div>${renderSingleFieldHTML(roundObj, 10)}</div>
                <div>${renderSingleFieldHTML(roundObj, 11)}</div>
                <div>${renderSingleFieldHTML(roundObj, 12)}</div>
                <div>${renderSingleFieldHTML(roundObj, 13)}</div>

                <!-- Fields 14, 15, 16, 17, 18 -->
                <div>${renderSingleFieldHTML(roundObj, 14)}</div>
                <div>${renderSingleFieldHTML(roundObj, 15)}</div>
                <div>${renderSingleFieldHTML(roundObj, 16)}</div>
                <div>${renderSingleFieldHTML(roundObj, 17)}</div>
                <div>${renderSingleFieldHTML(roundObj, 18)}</div>

                <!-- Bye Round Box (Spans 2 columns on bottom right, matching static mockup) -->
                <div class="col-span-2 border-2 border-slate-800 bg-[#8ab4ca] p-1 flex flex-col justify-between">
                  <div class="text-[8px] sm:text-[9.5px] font-extrabold text-slate-900 text-center border-b border-slate-700/40 pb-0.5 leading-tight">
                    ${roundObj.byeTitle}
                  </div>
                  <div class="flex flex-wrap items-center justify-center gap-1 my-auto py-0.5">
                    ${byeIconsHTML}
                  </div>
                </div>
              </div>

              <!-- Click Info Footer Label -->
              <div class="text-center mt-2 text-[10px] sm:text-xs font-semibold text-slate-700/80 no-print select-none">
                💡 Click on any field for more info
              </div>

            </div>
          </section>
        `;
      }).join('');
    }

    // ============================================================================
    // 8. RENDER RIGHT SIDEBAR ("MY TEAMS" LIST MATCHING STATIC IMAGE)
    // ============================================================================
    function renderSelectedTeamsSidebar() {
      const container = document.getElementById('selectedTeamsContainer');
      document.getElementById('selectedCount').textContent = selectedTeamIds.length;

      if (selectedTeamIds.length === 0) {
        container.innerHTML = `
          <div class="bg-white border-2 border-dashed border-slate-300 rounded-xl p-6 text-center text-slate-500 text-xs font-medium">
            No teams selected yet. Use the search bar or dropdown above to pick teams you want to track!
          </div>
        `;
        return;
      }

      const colorClasses = {
        blue:   'bg-blue-700 text-white border-blue-800',
        red:    'bg-red-600 text-white border-red-700',
        purple: 'bg-purple-700 text-white border-purple-800'
      };

      container.innerHTML = selectedTeamIds.map(teamId => {
        const team = TEAMS[teamId];
        if (!team) return '';
        const bannerClass = colorClasses[team.cardColor] || colorClasses.black;

        // Calculate quick round summary for this team on current day
        const roundPills = SCHEDULES[currentDay].rounds.map(r => {
          const m = r.games.find(g => g.t1 === teamId || g.t2 === teamId);
          if (m) {
            const oppId = m.t1 === teamId ? m.t2 : m.t1;
            return `<button type="button" onclick="openGamePopup(${r.roundNum}, ${m.field})" class="px-1.5 py-0.5 rounded bg-white/20 hover:bg-white/30 text-[10px] font-semibold cursor-pointer transition" title="View matchup details">R${r.roundNum}: F${m.field} (${TEAMS[oppId].shortLabel})</button>`;
          }
          if (r.byePool === team.pool) {
            return `<span class="px-1.5 py-0.5 rounded bg-white/10 text-white/75 text-[10px]">R${r.roundNum}: BYE</span>`;
          }
          return '';
        }).join('');

        return `
          <div class="flex items-stretch gap-2.5 group">
            <!-- Left Official Logo Box -->
            <div class="w-16 h-16 sm:w-20 sm:h-20 bg-white rounded-md border border-slate-200 flex items-center justify-center p-1 shrink-0 shadow-xs">
              ${getTeamBadgeHTML(team.id, "w-14 h-14 sm:w-16 sm:h-16")}
            </div>

            <!-- Right Color-Coded Team Banner (Matches FanMap-static.jpg) -->
            <div class="flex-1 ${bannerClass} border-2 rounded-xs px-3 py-1.5 flex flex-col justify-center relative shadow-xs">
              <button
                onclick="removeTeam('${team.id}')"
                class="no-print absolute top-1 right-1.5 text-white/60 hover:text-white text-sm font-black leading-none"
                title="Remove ${team.name}"
              >&times;</button>

              <div class="text-center">
                <div class="text-lg sm:text-2xl font-normal tracking-tight leading-tight">
                  ${team.name}
                </div>
                <div class="text-xs sm:text-sm font-normal text-white/95 leading-tight">
                  ${team.div} #${team.overall} Overall, ${team.seed}
                </div>
              </div>

              <!-- Mini Round Field Summary Strip -->
              <div class="flex flex-wrap justify-center gap-1 mt-1 no-print">
                ${roundPills}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // ============================================================================
    // 9. TEAM SELECTION, SEARCH, AND FILTER INTERACTIVITY
    // ============================================================================
    function populateDropdown() {
      const divFilter = document.getElementById('divisionFilter').value;
      const selectEl = document.getElementById('quickTeamSelect');

      const filtered = Object.values(TEAMS)
        .filter(t => divFilter === 'ALL' || t.div === divFilter)
        .sort((a, b) => a.div.localeCompare(b.div) || a.overall - b.overall);

      const groupOptionsHTML = `
        <option value="ALL_M">All Men's Teams (16)</option>
        <option value="ALL_W">All Women's Teams (16)</option>
        <option value="ALL_X">All Mixed Teams (16)</option>
        <option disabled>────────────────────────</option>
      `;

      selectEl.innerHTML = `<option value="">+ Quick Add Team (${filtered.length})...</option>` +
        groupOptionsHTML +
        filtered.map(t => {
          const isAdded = selectedTeamIds.includes(t.id);
          return `<option value="${t.id}">${isAdded ? '✓ ' : ''}[${t.div} #${t.overall}] ${t.name} (${t.seed})</option>`;
        }).join('');
    }

    function handleDropdownSelect(selectEl) {
      const val = selectEl.value;
      if (!val) return;

      if (val === 'ALL_M' || val === 'ALL_W' || val === 'ALL_X') {
        const targetDiv = val.split('_')[1];
        selectedTeamIds = Object.values(TEAMS)
          .filter(t => t.div === targetDiv)
          .sort((a, b) => a.overall - b.overall)
          .map(t => t.id);
        selectEl.value = "";
        refreshApp();
        return;
      }

      toggleTeam(val);
      selectEl.value = "";
    }

    function handleSearchInput() {
      const query = document.getElementById('teamSearchInput').value.trim().toLowerCase();
      const divFilter = document.getElementById('divisionFilter').value;
      const menu = document.getElementById('searchResultsMenu');

      const matches = Object.values(TEAMS).filter(t => {
        if (divFilter !== 'ALL' && t.div !== divFilter) return false;
        return t.name.toLowerCase().includes(query) ||
               t.fullName.toLowerCase().includes(query) ||
               t.seed.toLowerCase().includes(query);
      }).sort((a, b) => a.overall - b.overall);

      if (matches.length === 0) {
        menu.innerHTML = `<div class="p-2.5 text-xs text-slate-500">No matching teams found.</div>`;
      } else {
        menu.innerHTML = matches.map(t => {
          const isSelected = selectedTeamIds.includes(t.id);
          return `
            <button
              type="button"
              onclick="toggleTeam('${t.id}'); hideSearchResults();"
              class="w-full px-3 py-2 text-left text-xs hover:bg-blue-50 flex items-center justify-between transition"
            >
              <div class="flex items-center gap-2">
                ${getTeamBadgeHTML(t.id, "w-7 h-7")}
                <div>
                  <div class="font-bold text-slate-900">${t.fullName}</div>
                  <div class="text-[10px] text-slate-500">${t.div} #${t.overall} Overall • Pool ${t.seed}</div>
                </div>
              </div>
              <span class="px-2 py-0.5 rounded font-bold text-[10px] ${isSelected ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-800'}">
                ${isSelected ? 'Remove' : '+ Add'}
              </span>
            </button>
          `;
        }).join('');
      }
      menu.classList.remove('hidden');
    }

    function showSearchResults() {
      handleSearchInput();
    }

    function hideSearchResults() {
      document.getElementById('searchResultsMenu').classList.add('hidden');
      document.getElementById('teamSearchInput').value = '';
    }

    document.addEventListener('click', (e) => {
      const input = document.getElementById('teamSearchInput');
      const menu = document.getElementById('searchResultsMenu');
      if (input && menu && !input.contains(e.target) && !menu.contains(e.target)) {
        menu.classList.add('hidden');
      }
    });

    function toggleTeam(teamId) {
      if (selectedTeamIds.includes(teamId)) {
        selectedTeamIds = selectedTeamIds.filter(id => id !== teamId);
      } else {
        selectedTeamIds.push(teamId);
      }
      refreshApp();
    }

    function removeTeam(teamId) {
      selectedTeamIds = selectedTeamIds.filter(id => id !== teamId);
      refreshApp();
    }

    function loadMockupPreset() {
      selectedTeamIds = [...MOCKUP_PRESET_TEAMS];
      refreshApp();
    }

    function clearAllTeams() {
      selectedTeamIds = [];
      refreshApp();
    }

    // ============================================================================
    // 10. GAME MATCHUP POPUP MODAL (ON CLICK / TAP OF ANY FIELD OR TEAM)
    // ============================================================================
    function openGamePopup(roundNum, fieldNum) {
      const dayData = SCHEDULES[currentDay];
      const roundObj = dayData.rounds.find(r => r.roundNum === roundNum);
      if (!roundObj) return;

      const match = roundObj.games.find(g => g.field === fieldNum);
      document.getElementById('popupRoundLabel').textContent = roundObj.label;

      let fieldSub = `Field ${fieldNum}`;
      if ([3, 4, 12, 13].includes(fieldNum)) {
        fieldSub += ' (Field Pass)';
      } else if (fieldNum === 5) {
        fieldSub += ' (Showcase)';
      }
      document.getElementById('popupFieldLabel').textContent = fieldSub;

      const divBadgeEl = document.getElementById('popupDivisionBadge');
      const contentEl = document.getElementById('popupTeamsContent');

      if (!match) {
        divBadgeEl.innerHTML = '';
        contentEl.innerHTML = `
          <div class="py-6 text-center text-slate-600 font-semibold text-base">
            No game scheduled on Field ${fieldNum} during this round.
          </div>
        `;
      } else {
        const team1 = TEAMS[match.t1];
        const team2 = TEAMS[match.t2];
        const divNames = { W: "Women's Division", M: "Men's Division", X: "Mixed Division" };
        const divColors = {
          W: "bg-purple-100 text-purple-900 border-purple-300",
          M: "bg-sky-100 text-sky-900 border-sky-300",
          X: "bg-amber-100 text-amber-900 border-amber-300"
        };

        divBadgeEl.innerHTML = `
          <span class="inline-block px-3 py-1 rounded-full text-xs font-extrabold border ${divColors[team1.div] || 'bg-slate-100 text-slate-800'}">
            ${divNames[team1.div] || team1.div} • Pool ${team1.pool}
          </span>
        `;

        contentEl.innerHTML = `
          <!-- Team 1 Card -->
          <div class="flex items-center gap-3.5 p-3 rounded-xl bg-slate-50 border border-slate-200">
            <div class="w-14 h-14 sm:w-16 sm:h-16 bg-white rounded-lg border border-slate-200 p-1 flex items-center justify-center shrink-0 shadow-xs">
              ${getTeamBadgeHTML(team1.id, "w-12 h-12 sm:w-14 sm:h-14")}
            </div>
            <div class="flex-1 min-w-0">
              <div class="text-xl sm:text-2xl font-black text-slate-900 leading-tight break-words">
                ${team1.name}
              </div>
              <div class="text-xs sm:text-sm font-semibold text-slate-600 mt-0.5">
                ${team1.fullName}
              </div>
              <div class="text-xs font-bold text-slate-500 mt-0.5">
                Seed ${team1.seed} (#${team1.overall} Overall)
              </div>
            </div>
          </div>

          <!-- VS Divider -->
          <div class="flex items-center justify-center">
            <span class="px-3 py-0.5 rounded-full bg-slate-200 text-slate-700 font-black text-xs tracking-widest uppercase">
              VS
            </span>
          </div>

          <!-- Team 2 Card -->
          <div class="flex items-center gap-3.5 p-3 rounded-xl bg-slate-50 border border-slate-200">
            <div class="w-14 h-14 sm:w-16 sm:h-16 bg-white rounded-lg border border-slate-200 p-1 flex items-center justify-center shrink-0 shadow-xs">
              ${getTeamBadgeHTML(team2.id, "w-12 h-12 sm:w-14 sm:h-14")}
            </div>
            <div class="flex-1 min-w-0">
              <div class="text-xl sm:text-2xl font-black text-slate-900 leading-tight break-words">
                ${team2.name}
              </div>
              <div class="text-xs sm:text-sm font-semibold text-slate-600 mt-0.5">
                ${team2.fullName}
              </div>
              <div class="text-xs font-bold text-slate-500 mt-0.5">
                Seed ${team2.seed} (#${team2.overall} Overall)
              </div>
            </div>
          </div>
        `;
      }

      document.getElementById('gamePopupModal').classList.remove('hidden');
    }

    function closeGamePopup() {
      document.getElementById('gamePopupModal').classList.add('hidden');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeGamePopup();
      }
    });

    function refreshApp() {
      populateDropdown();
      renderAllMaps();
      renderSelectedTeamsSidebar();
    }

    window.addEventListener('DOMContentLoaded', () => {
      refreshApp();
    });
  </script>
</body>
</html>
